<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>GameBox</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="home" class="screen active">
      <header class="hero">
        <p class="eyebrow">GAMEBOX</p>
        <h1>Play anyone.<br>Even AI.</h1>
        <p class="subtitle">Quick games designed for your phone.</p>
      </header>

      <div class="game-card" onclick="openGame('tictactoe')">
        <div class="game-icon">✕<span>○</span></div>
        <div class="game-info">
          <h2>Tic-Tac-Toe</h2>
          <p>Play against an AI opponent</p>
        </div>
        <div class="chevron">›</div>
      </div>

      <div class="coming-soon">
        <span>＋</span>
        <div>
          <strong>More games</strong>
          <p>Chess, Checkers, 8-Ball and more</p>
        </div>
      </div>
    </section>

    <section id="game" class="screen">
      <div class="topbar">
        <button class="back" onclick="showHome()">‹</button>
        <h2>Tic-Tac-Toe</h2>
        <button class="reset-icon" onclick="newGame()">↻</button>
      </div>

      <div class="score-row">
        <div><span class="player-dot human"></span><strong>You</strong><b id="humanScore">0</b></div>
        <div><span class="player-dot ai"></span><strong>AI</strong><b id="aiScore">0</b></div>
      </div>

      <div class="status" id="status">Your turn</div>

      <div class="board" id="board"></div>

      <div class="difficulty-wrap">
        <p>AI difficulty</p>
        <div class="segmented">
          <button data-level="easy" onclick="setDifficulty('easy')">Easy</button>
          <button data-level="medium" onclick="setDifficulty('medium')">Medium</button>
          <button data-level="hard" class="selected" onclick="setDifficulty('hard')">Hard</button>
        </div>
      </div>

      <button class="primary" id="newGameButton" onclick="newGame()">New Game</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
